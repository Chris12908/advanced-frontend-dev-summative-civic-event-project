<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage users · CivicEvents+</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/custom.css">
</head>
<body class="flex min-h-screen flex-col bg-stone-50 font-sans text-slate-900 antialiased">
<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-[60] focus:rounded focus:bg-white focus:px-3 focus:py-2">Skip to main content</a>
<div id="site-header"></div>
<div class="flex flex-1">
<div id="sidebar"></div>
<main id="main" class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 md:px-8">
<h1 class="font-display text-3xl font-bold">Manage users</h1>
<div class="mt-5 max-w-sm"><label for="f-q" class="block text-sm font-semibold">Search users</label>
  <input id="f-q" type="search" class="mt-1 block w-full rounded border border-slate-400 bg-white px-3 py-2 focus:border-brand-700"></div>
<div class="mt-5 overflow-x-auto rounded-lg border border-slate-200 bg-white p-4">
  <table class="w-full min-w-[40rem] text-left text-sm"><caption class="sr-only">Users</caption>
    <thead><tr class="border-b">
      <th scope="col" class="py-2 pr-4">Name</th><th scope="col" class="py-2 pr-4">Email</th><th scope="col" class="py-2 pr-4">Role</th>
      <th scope="col" class="py-2 pr-4">Status</th><th scope="col" class="py-2">Actions</th></tr></thead>
    <tbody id="rows"></tbody></table>
</div>
<dialog id="user-dialog" aria-labelledby="ud-title" class="w-[calc(100%-2rem)] max-w-md rounded-lg p-0 shadow-xl backdrop:bg-black/50">
  <form method="dialog" class="p-6">
    <h2 id="ud-title" class="font-display text-xl font-bold">User profile</h2>
    <div id="user-body" class="mt-4"></div>
    <div class="mt-6 text-right"><button class="rounded bg-brand-700 px-4 py-2 font-semibold text-white hover:bg-brand-800">Close</button></div>
  </form>
</dialog>
</main>
</div>
<div id="site-footer"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script src="js/pages/admin-users.js"></script>
</body>
</html>
