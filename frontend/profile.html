<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My profile · CivicEvents+</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/custom.css">
</head>
<body class="flex min-h-screen flex-col bg-stone-50 font-sans text-slate-900 antialiased">
<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-[60] focus:rounded focus:bg-white focus:px-3 focus:py-2">Skip to main content</a>
<div id="site-header"></div>
<div class="flex flex-1">
<div id="sidebar"></div>
<main id="main" class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 md:px-8">
<div id="form-wrap" class="max-w-xl">
  <h1 class="font-display text-3xl font-bold">My profile</h1>
  <dl class="mt-4 grid grid-cols-3 gap-2 rounded-lg border border-slate-200 bg-white p-4 text-sm">
    <dt class="font-semibold">Role</dt><dd id="role" class="col-span-2"></dd>
    <dt class="font-semibold">Status</dt><dd id="status" class="col-span-2"></dd>
    <dt class="font-semibold">Joined</dt><dd id="joined" class="col-span-2"></dd>
  </dl>
  <p id="form-error" role="alert" class="mt-4 hidden rounded border border-red-300 bg-red-50 p-3 text-sm text-red-900"></p>
  <form id="profile-form" class="mt-6 space-y-5" novalidate>
    <div><label for="full_name" class="block text-sm font-semibold">Full name</label>
      <input id="full_name" type="text" autocomplete="name" aria-describedby="full_name-error" class="mt-1 block w-full rounded border border-slate-400 bg-white px-3 py-2 focus:border-brand-700">
      <p id="full_name-error" class="mt-1 hidden text-sm text-red-800"></p></div>
    <div><label for="email" class="block text-sm font-semibold">Email</label>
      <input id="email" type="email" autocomplete="email" aria-describedby="email-error" class="mt-1 block w-full rounded border border-slate-400 bg-white px-3 py-2 focus:border-brand-700">
      <p id="email-error" class="mt-1 hidden text-sm text-red-800"></p></div>
    <p class="text-sm text-slate-700">Your role and status can only be changed by an administrator.</p>
    <button id="save-btn" type="submit" class="rounded bg-brand-700 px-5 py-2.5 font-semibold text-white hover:bg-brand-800 disabled:opacity-60">Save changes</button>
  </form>
</div>
</main>
</div>
<div id="site-footer"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script src="js/pages/profile.js"></script>
</body>
</html>
