<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications · CivicEvents+</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/custom.css">
</head>
<body class="flex min-h-screen flex-col bg-stone-50 font-sans text-slate-900 antialiased">
<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-[60] focus:rounded focus:bg-white focus:px-3 focus:py-2">Skip to main content</a>
<div id="site-header"></div>
<div class="flex flex-1">
<div id="sidebar"></div>
<main id="main" class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 md:px-8">
<div class="flex flex-wrap items-center justify-between gap-3">
  <h1 class="font-display text-3xl font-bold">Notifications</h1>
  <button id="mark-all" type="button" class="rounded border border-slate-400 bg-white px-3 py-1.5 text-sm font-semibold hover:bg-slate-100">Mark all as read</button>
</div>
<div class="mt-6 grid gap-6 md:grid-cols-5">
  <ul id="list" class="rounded-lg border border-slate-200 bg-white md:col-span-2" aria-label="Notification list"></ul>
  <section id="notif-detail" class="rounded-lg border border-slate-200 bg-white p-6 md:col-span-3" aria-live="polite">
    <p class="text-slate-700">Select a notification to read it.</p>
  </section>
</div>
</main>
</div>
<div id="site-footer"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script src="js/pages/notifications.js"></script>
</body>
</html>
