<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events · CivicEvents+</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/custom.css">
</head>
<body class="flex min-h-screen flex-col bg-stone-50 font-sans text-slate-900 antialiased">
<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-[60] focus:rounded focus:bg-white focus:px-3 focus:py-2">Skip to main content</a>
<div id="site-header"></div>
<div class="flex flex-1">
<div id="sidebar"></div>
<main id="main" class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 md:px-8">
<section class="hero-grad rounded-2xl p-6 md:p-10">
  <p class="eyebrow">Around your neighbourhood</p>
  <div class="mt-2 flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="font-display text-4xl font-bold md:text-5xl">Events</h1>
      <p class="mt-2 max-w-xl text-slate-700">Make room for local. Discover events, meet your neighbours and be part of something nearby.</p>
    </div>
    <div id="admin-actions"></div>
  </div>
</section>
<form id="filters" class="mt-5 grid gap-3 rounded-lg border border-slate-200 bg-white p-4 shadow-sm sm:grid-cols-2 lg:grid-cols-4" role="search" aria-label="Filter events">
  <div><label for="f-q" class="block text-sm font-semibold">Search</label>
    <input id="f-q" type="search" class="mt-1 block w-full rounded border border-slate-400 bg-white px-3 py-2 focus:border-brand-700"></div>
  <div><label for="f-loc" class="block text-sm font-semibold">Location</label>
    <select id="f-loc" class="mt-1 block w-full rounded border border-slate-400 bg-white px-3 py-2 focus:border-brand-700"><option value="">All locations</option></select></div>
  <div><label for="f-date" class="block text-sm font-semibold">Starting from</label>
    <input id="f-date" type="date" class="mt-1 block w-full rounded border border-slate-400 bg-white px-3 py-2 focus:border-brand-700"></div>
  <div class="flex items-end"><button id="reset" type="button" class="rounded border border-slate-400 bg-white px-4 py-2 font-semibold hover:bg-slate-100">Clear filters</button></div>
</form>
<p id="count" class="mt-4 text-sm text-slate-700" aria-live="polite"></p>
<div id="grid" class="mt-4 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
<nav id="pager" class="mt-6 flex items-center justify-center" aria-label="Pagination"></nav>
</main>
</div>
<div id="site-footer"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script src="js/pages/events.js"></script>
</body>
</html>
