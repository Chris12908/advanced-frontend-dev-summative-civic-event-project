<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · CivicEvents+</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/custom.css">
</head>
<body class="flex min-h-screen flex-col bg-stone-50 font-sans text-slate-900 antialiased">
<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-[60] focus:rounded focus:bg-white focus:px-3 focus:py-2">Skip to main content</a>
<div id="site-header"></div>
<div class="flex flex-1">
<div id="sidebar"></div>
<main id="main" class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 md:px-8">
<section class="hero-grad rounded-2xl p-6 md:p-10">
  <p class="eyebrow">Your community at a glance</p>
  <h1 id="page-title" class="mt-2 font-display text-4xl font-bold text-brand-900 md:text-5xl">Dashboard</h1>
  <p id="hero-sub" class="mt-2 max-w-xl text-slate-700"></p>
</section>

<section class="mt-10" aria-labelledby="stats-h">
  <h2 id="stats-h" class="section-title">Overview</h2>
  <div id="stats" class="mt-4"></div>
</section>

<section class="mt-10" aria-labelledby="quick-h">
  <h2 id="quick-h" class="section-title">Quick actions</h2>
  <div id="quick" class="mt-4 grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></div>
</section>

<section class="mt-10" aria-labelledby="up-h">
  <div class="flex flex-wrap items-end justify-between gap-2">
    <h2 id="up-h" class="section-title">Coming up</h2>
    <a href="events.html" class="text-sm font-semibold text-brand-700 underline">See all events</a>
  </div>
  <div id="upcoming" class="mt-4 grid gap-4 md:grid-cols-3"></div>
</section>

<section id="charts-wrap" class="mt-10 hidden" aria-labelledby="charts-h">
  <h2 id="charts-h" class="section-title">Trends</h2>
  <div id="charts" class="mt-4 grid gap-4 lg:grid-cols-3"></div>
</section>
</main>
</div>
<div id="site-footer"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script src="js/pages/dashboard.js"></script>
</body>
</html>
